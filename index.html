            const fechaLocal = new Date(fecha.getTime() - offset);
            return fechaLocal.toISOString().split('T')[0];

                }
              }

              setSyncStatus(`Sincronización completada: ${sincronizados} registros sincronizados, ${errores} errores`);

              if (sincronizados > 0) {
                cargarRegistrosFirebase();
              }

              setSyncing(false);
              return true;
            } catch (error) {
              console.error('Error en sincronización:', error);

              setTimeout(() => setSyncStatus(''), 5000);
              setSyncing(false);
              return false;

          const cargarRegistrosFirebase = () => {
            if (!firebaseInitialized || !database) return;

            try {
              const registrosRef = database.ref('registros');
              registrosRef.once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data) {
                  const registrosArray = Object.keys(data).map(key => ({
                    firebaseId: key,
                    ...data[key]
                  }));
                  setRegistros(registrosArray.sort(ordenarRegistros));
                }
              });
            } catch (error) {
              console.error('Error cargando registros de Firebase:', error);
            }

            loadData();
            if (firebaseInitialized) {
              setupFirebaseListeners();

            const handleOnline = () => {
              setIsOnline(true);
              setSyncStatus('Conectado a Firebase - Sincronizando...');
              setTimeout(() => {
                sincronizarRegistrosOffline();
              }, 2000);
            };
            
            const handleOffline = () => {
              setIsOnline(false);
              setSyncStatus('Modo offline - Los datos se guardarán localmente');
              setTimeout(() => setSyncStatus(''), 5000);
            };
            
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            
            return () => {
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
            };
          }, []);

              setFirebaseError('Firebase no está inicializado');

              const registrosRef = database.ref('registros');
              registrosRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                  const registrosArray = Object.keys(data).map(key => ({
                    firebaseId: key,
                    ...data[key]
                  }));
                  setRegistros(registrosArray.sort(ordenarRegistros));
                  setFirebaseError('');
                } else {
                  setRegistros([]);
                }
              }, (error) => {
                console.error('Error escuchando registros:', error);
                setFirebaseError('Error conectando a Firebase: ' + error.message);

              console.error('Error configurando listeners:', error);
              setFirebaseError('Error de conexión con Firebase');
            }

              const localesStorage = localStorage.getItem('locales-gran-manzana');

                const savedLocales = JSON.parse(localesStorage);
                savedLocales.forEach(saved => {
                  const local = initialLocales.find(l => String(l.numero) === String(saved.numero));
                  if (local && saved.ultimaLectura) {
                    local.ultimaLectura = saved.ultimaLectura;

              setLocales(initialLocales);

              console.error('Error cargando datos:', err);

                ...l,

                  consumoPorMes[key].total += consumo;
                  consumoPorMes[key].registros++;
                }
              }
            });
            
            return Object.values(consumoPorMes).sort((a, b) => {

                  local: r.local,
                  inquilino: r.inquilino,
                  mensaje: `Consumo elevado: ${consumo.toFixed(2)} m³`,
                  fecha: fechaRegistro,
                  severidad: 'media'
                });
              } else if (consumo === 0) {
                anomalias.push({
                  tipo: 'info',
                  local: r.local,
                  inquilino: r.inquilino,
                  mensaje: 'Sin consumo detectado',
                  fecha: fechaRegistro,
                  severidad: 'baja'
                });
              }
            });
            
            return anomalias.sort((a, b) => {
              const severidadOrden = { alta: 0, media: 1, baja: 2 };
              return severidadOrden[a.severidad] - severidadOrden[b.severidad];
            });
          };

          const obtenerHistorialCorrecciones = () => {
            return registros
              .filter(r => r.fechaCorreccion)
              .sort((a, b) => new Date(b.fechaCorreccion) - new Date(a.fechaCorreccion))
              .slice(0, 50);
          };

          const generarCalendarioMes = () => {
            const primerDia = new Date(anioSeleccionado, mesSeleccionado, 1);
            const ultimoDia = new Date(anioSeleccionado, mesSeleccionado + 1, 0);
            const dias = [];
            
            const diaSemanaInicio = primerDia.getDay();
            for (let i = 0; i < diaSemanaInicio; i++) {
              dias.push(null);
            }
            
            for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
              const fecha = `${anioSeleccionado}-${String(mesSeleccionado + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
              const registrosDia = registros.filter(r => {
                if (!r.fecha) return false;
                return obtenerFechaLocal(r.fecha) === fecha;
              });
              
              const porcentaje = (registrosDia.length / locales.length) * 100;
              let estado = 'empty';
              if (porcentaje >= 90) estado = 'complete';
              else if (porcentaje >= 50) estado = 'partial';
              
              dias.push({
                dia,
                fecha,
                registros: registrosDia.length,
                total: locales.length,
                porcentaje: Math.round(porcentaje),
                estado
              });
            }
            
            return dias;
          };

          useEffect(() => {
            if (activeTab === 'dashboard' && chartRef.current) {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }

              const consumoMensual = calcularConsumoMensual();
              const meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
              
              const ctx = chartRef.current.getContext('2d');
              chartInstance.current = new Chart(ctx, {
                type: 'bar',
                data: {
                  labels: consumoMensual.map(c => `${meses[c.mes]} ${c.anio}`),
                  datasets: [{
                    label: 'Consumo Total (m³)',
                    data: consumoMensual.map(c => c.total.toFixed(2)),
                    backgroundColor: 'rgba(145, 150, 119, 0.6)',
                    borderColor: 'rgba(145, 150, 119, 1)',
                    borderWidth: 2
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: {
                      display: true,
                      position: 'top',
                    },
                    title: {
                      display: true,
                      text: 'Consumo Mensual de Agua'
                    }
                  },
                  scales: {
                    y: {
                      beginAtZero: true,
                      title: {
                        display: true,
                        text: 'Metros Cúbicos (m³)'
                      }
                    }
                  }
                }
              });
            }

            return () => {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
            };
          }, [activeTab, registros, locales]);

          const filteredLocales = locales.filter(local => {
            const search = searchTerm.toLowerCase();
            return (
              String(local.numero).toLowerCase().includes(search) ||
              local.inquilino.toLowerCase().includes(search)
            );
          });

          // ========== RENDERIZADO DE LOGIN ==========
          if (!user) {
            return (
              <div className="min-h-screen bg-azul-lgm flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md border border-gray-200">
                  <div className="text-center mb-8">
                    <div className="mb-4">
                      <h1 className="text-4xl font-bold text-azul-lgm mb-2">La Gran Manzana</h1>
                      <div className="text-sm text-gray-600 space-y-1">
                        <p className="font-semibold">Centro Comercial</p>
                        <p>Sistema de Registro de Medidores</p>
                      </div>
                    </div>
                    <div className="mt-3 flex items-center justify-center gap-2">
                      {isOnline ? (
                        <span className="flex items-center gap-1 text-green-600 text-sm">
                          <Wifi className="w-4 h-4" />
                          {firebaseInitialized ? 'Conectado a Firebase' : 'Conectado (Modo Local)'}
                        </span>
                      ) : (
                        <span className="flex items-center gap-1 text-orange-600 text-sm">
                          <WifiOff className="w-4 h-4" />
                          Sin conexión
                        </span>
                      )}
                    </div>
                    {firebaseError && (
                      <div className="mt-2 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">
                        {firebaseError}
                      </div>
                    )}
                  </div>
                  
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Usuario</label>
                      <input
                        type="text"
                        value={loginUsername}
                        onChange={(e) => setLoginUsername(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                        placeholder="Ingrese su usuario"
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                      <input
                        type="password"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                        placeholder="Ingrese su contraseña"
                      />
                    </div>

                    {loginUsername === 'guardia' && (
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Nombre y Apellido *</label>
                        <input
                          type="text"
                          value={nombreGuardia}
                          onChange={(e) => setNombreGuardia(e.target.value)}
                          onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                          className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                          placeholder="Ej: Juan Pérez"
                        />
                      </div>
                    )}

                    {error && (
                      <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start gap-2">
                        <AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                        <span className="text-sm">{error}</span>
                      </div>
                    )}

                    <button
                      onClick={handleLogin}
                      className="w-full bg-verde-lgm hover:bg-[#7a8560] text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105 shadow-lg"
                    >
                      Iniciar Sesión
                    </button>
                  </div>

                  <div className="mt-6 p-4 bg-gray-50 rounded-xl text-sm text-gray-600">
                    <p className="font-semibold mb-2">Credenciales de acceso:</p>
                    <p><strong>Guardias:</strong> usuario: guardia | contraseña: 1234</p>
                    <p className="text-xs text-gray-500 mt-1">* Después de ingresar usuario y contraseña, escriba su nombre completo</p>
                  </div>

                  {!firebaseInitialized && (
                    <div className="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded-xl text-xs text-yellow-800">
                      <p className="font-semibold mb-1">⚠️ Modo Local Activado</p>
                      <p>Firebase no está disponible. Los datos se guardarán localmente.</p>
                    </div>
                  )}
                </div>
              </div>
            );
          }

          // ========== RENDERIZADO DE PANEL ADMIN CON TABS ==========
          if (view === 'admin') {
            const progreso = calcularProgreso();
            const hoy = obtenerHoy();
            const registrosHoy = registros.filter(r => {
              if (!r.fecha) return false;
              const fechaRegistro = obtenerFechaLocal(r.fecha);
              return fechaRegistro === hoy;
            });

            const top10 = calcularTop10Consumo();
            const anomalias = detectarAnomalias();
            const historialCorrecciones = obtenerHistorialCorrecciones();
            const calendarioDias = generarCalendarioMes();
            const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

            return (
              <div className="min-h-screen bg-gray-50 p-4">
                <div className="max-w-7xl mx-auto">
                  {/* HEADER */}
                  <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-200">
                    <div className="flex justify-between items-center mb-6">
                      <div>
                        <h1 className="text-3xl font-bold text-azul-lgm mb-2">Panel Administrativo</h1>
                        <p className="text-gray-600">Bienvenido, <span className="font-semibold text-verde-lgm">{user.nombre}</span></p>
                      </div>
                      <div className="flex items-center gap-3">
                        {isOnline ? (
                          <span className="flex items-center gap-1 text-green-600 text-sm bg-green-50 px-3 py-1 rounded-full">
                            <Wifi className="w-4 h-4" />
                            {firebaseInitialized ? 'Firebase' : 'Local'}
                          </span>
                        ) : (
                          <span className="flex items-center gap-1 text-orange-600 text-sm bg-orange-50 px-3 py-1 rounded-full">
                            <WifiOff className="w-4 h-4" />
                            Offline
                          </span>
                        )}
                        <button
                          onClick={() => { setUser(null); setView('login'); }}
                          className="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl transition-all transform hover:scale-105"
                        >
                          <LogOut className="w-4 h-4" />
                          Salir
                        </button>
                      </div>
                    </div>

                    {syncStatus && (
                      <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-800">
                        {syncStatus}
                      </div>
                    )}

                    {firebaseError && (
                      <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-800">
                        {firebaseError}
                      </div>
                    )}

                    {/* TARJETAS DE RESUMEN */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                      <div className="bg-azul-lgm text-white p-4 rounded-xl shadow-lg">
                        <div className="flex items-center gap-3">
                          <Calendar className="w-8 h-8 text-white" />
                          <div>
                            <p className="text-sm opacity-90">Fecha</p>
                            <p className="text-xl font-bold">{new Date().toLocaleDateString()}</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-verde-lgm text-white p-4 rounded-xl shadow-lg">
                        <div className="flex items-center gap-3">
                          <CheckCircle className="w-8 h-8 text-white" />
                          <div>
                            <p className="text-sm opacity-90">Registrados Hoy</p>
                            <p className="text-xl font-bold">{progreso.completados} / {progreso.total}</p>
                          </div>
                        </div>
                      </div>

                      <div className="bg-azul-lgm text-white p-4 rounded-xl shadow-lg">
                        <div className="flex items-center gap-3">
                          <Clock className="w-8 h-8 text-white" />
                          <div>
                            <p className="text-sm opacity-90">Progreso</p>
                            <p className="text-xl font-bold">{progreso.porcentaje}%</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="mb-6">
                      <div className="w-full bg-gray-200 rounded-full h-4">
                        <div
                          className="bg-verde-lgm h-4 rounded-full transition-all duration-500 shadow-lg"
                          style={{ width: `${progreso.porcentaje}%` }}
                        ></div>
                      </div>
                    </div>

                    {/* TABS DE NAVEGACIÓN */}
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={() => setActiveTab('registros')}
                        className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab === 'registros' ? 'tab-active' : 'tab-inactive hover:bg-gray-200'}`}
                      >
                        📋 Registros
                      </button>
                      <button
                        onClick={() => setActiveTab('dashboard')}
                        className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab === 'dashboard' ? 'tab-active' : 'tab-inactive hover:bg-gray-200'}`}
                      >
                        📈 Dashboard
                      </button>
                      <button
                        onClick={() => setActiveTab('alertas')}
                        className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab === 'alertas' ? 'tab-active' : 'tab-inactive hover:bg-gray-200'}`}
                      >
                        ⚠️ Alertas
                      </button>
                      <button
                        onClick={() => setActiveTab('historial')}
                        className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab === 'historial' ? 'tab-active' : 'tab-inactive hover:bg-gray-200'}`}
                      >
                        🕐 Correcciones
                      </button>
                      <button
                        onClick={() => setActiveTab('calendario')}
                        className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab === 'calendario' ? 'tab-active' : 'tab-inactive hover:bg-gray-200'}`}
                      >
                        📅 Calendario
                      </button>
                    </div>
                  </div>

                  {/* TAB: REGISTROS */}
                  {activeTab === 'registros' && (
                    <div>
                      {!isOnline && (
                        <div className="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-xl">
                          <div className="flex items-center justify-between">
                            <div>
                              <p className="font-semibold text-yellow-800">Modo Offline</p>
                              <p className="text-sm text-yellow-700">Los registros se guardan localmente</p>
                            </div>
                            <button
                              onClick={sincronizarRegistrosOffline}
                              disabled={syncing || !isOnline}
                              className="flex items-center gap-2 px-4 py-2 bg-azul-lgm hover:bg-[#1a1f45] disabled:bg-gray-400 text-white rounded-xl transition-all"
                            >
                              <CloudUpload className="w-4 h-4" />
                              {syncing ? 'Sincronizando...' : 'Sincronizar'}
                            </button>
                          </div>
                        </div>
                      )}

                      <div className="bg-blue-50 p-6 rounded-xl mb-6 border border-blue-200">
                        <h3 className="text-xl font-bold text-azul-lgm mb-4 flex items-center gap-2">
                          <Calendar className="w-6 h-6" />
                          Exportar Registros por Fechas
                        </h3>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Fecha de Inicio *
                            </label>
                            <input
                              type="date"
                              value={fechaInicio}
                              onChange={(e) => setFechaInicio(e.target.value)}
                              className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                            />
                          </div>
                          
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">
                              Fecha de Fin (opcional)
                            </label>
                            <input
                              type="date"
                              value={fechaFin}
                              onChange={(e) => setFechaFin(e.target.value)}
                              className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                            />
                            <p className="text-xs text-gray-500 mt-1">
                              Si no selecciona fecha fin, se exportará solo la fecha de inicio
                            </p>
                          </div>
                          
                          <div className="flex items-end">
                            <button
                              onClick={exportarExcelPorFechas}
                              disabled={!fechaInicio}
                              className="w-full flex items-center justify-center gap-2 px-6 py-3 bg-azul-lgm hover:bg-[#1a1f45] disabled:bg-gray-400 text-white rounded-xl transition-all transform hover:scale-105 font-semibold shadow-lg"
                            >
                              <Download className="w-5 h-5" />
                              Exportar por Fechas
                            </button>
                          </div>
                        </div>
                        
                        <div className="text-sm text-gray-600">
                          <p><strong>Nota:</strong> El archivo se descargará en formato CSV compatible con Excel.</p>
                          <p>Incluye todos los registros del rango de fechas seleccionado.</p>
                        </div>
                      </div>

                      <div className="flex gap-4 mb-6">
                        <button
                          onClick={exportarExcel}
                          disabled={registrosHoy.length === 0}
                          className="flex items-center gap-2 px-6 py-3 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white rounded-xl transition-all transform hover:scale-105 font-semibold shadow-lg"
                        >
                          <Download className="w-5 h-5" />
                          Exportar Hoy ({registrosHoy.length} registros)
                        </button>
                      </div>

                      <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6">
                          Registros de Hoy 
                          <span className="text-sm font-normal text-gray-600 ml-2">
                            {firebaseInitialized ? '(Tiempo Real)' : '(Modo Local)'}
                          </span>
                        </h2>
                        <div className="overflow-x-auto">
                          <table className="w-full">
                            <thead className="bg-gray-50">
                              <tr>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Local</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Inquilino</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Lectura</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Hora</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Guardia</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Foto</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Estado</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Acciones</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                              {registrosHoy.length === 0 ? (
                                <tr>
                                  <td colSpan="8" className="px-4 py-8 text-center text-gray-500">
                                    No hay registros para hoy
                                  </td>
                                </tr>
                              ) : (
                                registrosHoy
                                  .sort(ordenarRegistros)
                                  .map(r => (
                                    <tr key={r.firebaseId || r.id} className="hover:bg-gray-50 transition-colors">
                                      <td className="px-4 py-3 text-sm font-medium text-gray-900">{r.local}</td>
                                      <td className="px-4 py-3 text-sm text-gray-700">{r.inquilino}</td>
                                      <td className="px-4 py-3 text-sm text-gray-700 font-semibold">
                                        {r.lectura} m³
                                        {r.lecturaAnterior && (
                                          <div className="text-xs text-red-600">
                                            Corregido: {r.lecturaAnterior} m³ → {r.lectura} m³
                                          </div>
                                        )}
                                      </td>
                                      <td className="px-4 py-3 text-sm text-gray-700">
                                        {r.fecha ? new Date(r.fecha).toLocaleTimeString() : 'Hora no disponible'}
                                        {r.fechaCorreccion && (
                                          <div className="text-xs text-blue-600">
                                            Corregido: {new Date(r.fechaCorreccion).toLocaleTimeString()}
                                          </div>
                                        )}
                                      </td>
                                      <td className="px-4 py-3 text-sm text-gray-700">
                                        {r.guardia}
                                        {r.corregidoPor && r.corregidoPor !== r.guardia && (
                                          <div className="text-xs text-blue-600">
                                            Corregido por: {r.corregidoPor}
                                          </div>
                                        )}
                                      </td>
                                      <td className="px-4 py-3">
                                        {r.foto ? (
                                          <img src={r.foto} alt="Medidor" className="w-16 h-16 object-cover rounded-lg cursor-pointer shadow-sm" 
                                               onClick={() => window.open(r.foto, '_blank')} />
                                        ) : (
                                          <span className="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">Sin foto</span>
                                        )}
                                      </td>
                                      <td className="px-4 py-3">
                                        {r.firebaseId ? (
                                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full">
                                            <Wifi className="w-3 h-3" />
                                            En Firebase
                                          </span>
                                        ) : (
                                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full">
                                            <WifiOff className="w-3 h-3" />
                                            Local
                                          </span>
                                        )}
                                        {r.fechaCorreccion && (
                                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full mt-1">
                                            Corregido
                                          </span>
                                        )}
                                      </td>
                                      <td className="px-4 py-3">
                                        <div className="flex gap-2">
                                          <button
                                            onClick={() => iniciarEdicion(r)}
                                            className="flex items-center gap-1 px-3 py-1 bg-azul-lgm hover:bg-[#1a1f45] text-white rounded-lg text-xs transition-colors"
                                          >
                                            <Edit className="w-3 h-3" />
                                            Editar
                                          </button>
                                          <button
                                            onClick={() => eliminarRegistro(r)}
                                            className="flex items-center gap-1 px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs transition-colors"
                                          >
                                            <Trash className="w-3 h-3" />
                                            Eliminar
                                          </button>
                                        </div>
                                      </td>
                                    </tr>
                                  ))
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB: DASHBOARD */}
                  {activeTab === 'dashboard' && (
                    <div className="space-y-6">
                      {/* GRÁFICO DE CONSUMO MENSUAL */}
                      <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                          <BarChart className="w-6 h-6 text-verde-lgm" />
                          Consumo Mensual de Agua
                        </h2>
                        <div style={{ height: '400px' }}>
                          <canvas ref={chartRef}></canvas>
                        </div>
                      </div>

                      {/* TOP 10 LOCALES */}
                      <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                          <Award className="w-6 h-6 text-yellow-500" />
                          Top 10 Locales con Mayor Consumo
                        </h2>
                        {top10.length === 0 ? (
                          <p className="text-center text-gray-500 py-8">No hay datos suficientes para mostrar el top 10</p>
                        ) : (
                          <div className="space-y-3">
                            {top10.map((item, index) => (
                              <div key={item.local} className="flex items-center justify-between p-4 bg-gradient-to-r from-verde-lgm to-azul-lgm text-white rounded-xl shadow-md">
                                <div className="flex items-center gap-4">
                                  <div className="bg-white text-azul-lgm w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg">
                                    {index + 1}
                                  </div>
                                  <div>
                                    <p className="font-semibold text-lg">Local {item.local} - {item.inquilino}</p>
                                    <p className="text-sm opacity-90">{item.registros} registros</p>
                                  </div>
                                </div>
                                <div className="text-right">
                                  <p className="text-2xl font-bold">{item.consumoTotal.toFixed(2)} m³</p>
                                  <p className="text-sm opacity-90">consumo total</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB: ALERTAS */}
                  {activeTab === 'alertas' && (
                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                      <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <AlertTriangle className="w-6 h-6 text-red-500" />
                        Alertas de Lecturas Anómalas (Últimos 7 días)
                      </h2>
                      {anomalias.length === 0 ? (
                        <div className="text-center py-12">
                          <CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-4" />
                          <p className="text-xl font-semibold text-gray-700">¡Todo en orden!</p>
                          <p className="text-gray-500">No se detectaron anomalías en las lecturas recientes</p>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          {anomalias.map((alerta, index) => {
                            let bgColor = 'bg-gray-50';
                            let borderColor = 'border-gray-200';
                            let iconColor = 'text-gray-600';
                            
                            if (alerta.severidad === 'alta') {
                              bgColor = 'bg-red-50';
                              borderColor = 'border-red-300';
                              iconColor = 'text-red-600';
                            } else if (alerta.severidad === 'media') {
                              bgColor = 'bg-yellow-50';
                              borderColor = 'border-yellow-300';
                              iconColor = 'text-yellow-600';
                            } else {
                              bgColor = 'bg-blue-50';
                              borderColor = 'border-blue-300';
                              iconColor = 'text-blue-600';
                            }
                            
                            return (
                              <div key={index} className={`${bgColor} border ${borderColor} p-4 rounded-xl`}>
                                <div className="flex items-start gap-3">
                                  <AlertTriangle className={`w-6 h-6 ${iconColor} flex-shrink-0 mt-1`} />
                                  <div className="flex-1">
                                    <div className="flex justify-between items-start mb-2">
                                      <div>
                                        <p className="font-semibold text-gray-800">
                                          Local {alerta.local} - {alerta.inquilino}
                                        </p>
                                        <p className="text-sm text-gray-600">{alerta.mensaje}</p>
                                      </div>
                                      <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                        alerta.severidad === 'alta' ? 'bg-red-200 text-red-800' :
                                        alerta.severidad === 'media' ? 'bg-yellow-200 text-yellow-800' :
                                        'bg-blue-200 text-blue-800'
                                      }`}>
                                        {alerta.severidad.toUpperCase()}
                                      </span>
                                    </div>
                                    <p className="text-xs text-gray-500">Fecha: {alerta.fecha}</p>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB: HISTORIAL DE CORRECCIONES */}
                  {activeTab === 'historial' && (
                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                      <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <History className="w-6 h-6 text-blue-600" />
                        Historial de Correcciones (Últimas 50)
                      </h2>
                      {historialCorrecciones.length === 0 ? (
                        <p className="text-center text-gray-500 py-12">No hay correcciones registradas</p>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full">
                            <thead className="bg-gray-50">
                              <tr>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Fecha Corrección</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Local</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Inquilino</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Lectura Original</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Lectura Corregida</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Corregido Por</th>
                                <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Fecha Original</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                              {historialCorrecciones.map((r, index) => (
                                <tr key={r.firebaseId || r.id || index} className="hover:bg-gray-50 transition-colors">
                                  <td className="px-4 py-3 text-sm text-gray-700">
                                    {new Date(r.fechaCorreccion).toLocaleString('es-EC')}
                                  </td>
                                  <td className="px-4 py-3 text-sm font-medium text-gray-900">{r.local}</td>
                                  <td className="px-4 py-3 text-sm text-gray-700">{r.inquilino}</td>
                                  <td className="px-4 py-3 text-sm text-red-600 font-semibold">
                                    {r.lecturaAnterior} m³
                                  </td>
                                  <td className="px-4 py-3 text-sm text-green-600 font-semibold">
                                    {r.lectura} m³
                                  </td>
                                  <td className="px-4 py-3 text-sm text-gray-700">{r.corregidoPor}</td>
                                  <td className="px-4 py-3 text-sm text-gray-500">
                                    {r.fecha ? new Date(r.fecha).toLocaleDateString('es-EC') : 'N/A'}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB: CALENDARIO */}
                  {activeTab === 'calendario' && (
                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                      <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                          <Calendar className="w-6 h-6 text-verde-lgm" />
                          Calendario de Lecturas
                        </h2>
                        <div className="flex items-center gap-3">
                          <select
                            value={mesSeleccionado}
                            onChange={(e) => setMesSeleccionado(parseInt(e.target.value))}
                            className="px-4 py-2 border border-gray-300 rounded-lg"
                          >
                            {meses.map((mes, index) => (
                              <option key={index} value={index}>{mes}</option>
                            ))}
                          </select>
                          <select
                            value={anioSeleccionado}
                            onChange={(e) => setAnioSeleccionado(parseInt(e.target.value))}
                            className="px-4 py-2 border border-gray-300 rounded-lg"
                          >
                            {[2023, 2024, 2025, 2026].map(anio => (
                              <option key={anio} value={anio}>{anio}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      {/* Leyenda */}
                      <div className="flex flex-wrap gap-4 mb-6 p-4 bg-gray-50 rounded-lg">
                        <div className="flex items-center gap-2">
                          <div className="w-6 h-6 bg-green-200 border border-green-400 rounded"></div>
                          <span className="text-sm text-gray-700">≥ 90% completado</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="w-6 h-6 bg-yellow-200 border border-yellow-400 rounded"></div>
                          <span className="text-sm text-gray-700">50-89% completado</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <div className="w-6 h-6 bg-red-200 border border-red-400 rounded"></div>
                          <span className="text-sm text-gray-700">{'<'} 50% completado</span>
                        </div>
                      </div>

                      {/* Calendario */}
                      <div className="grid grid-cols-7 gap-2">
                        {['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(dia => (
                          <div key={dia} className="text-center font-semibold text-gray-700 py-2">
                            {dia}
                          </div>
                        ))}
                        {calendarioDias.map((dia, index) => {
                          if (!dia) {
                            return <div key={`empty-${index}`} className="calendar-day"></div>;
                          }
                          
                          let estadoClass = 'calendar-day-empty';
                          if (dia.estado === 'complete') estadoClass = 'calendar-day-complete';
                          else if (dia.estado === 'partial') estadoClass = 'calendar-day-partial';
                          
                          return (
                            <div key={dia.dia} className={`calendar-day ${estadoClass} p-2 rounded-lg cursor-pointer hover:shadow-md transition-shadow`}>
                              <div className="font-bold text-gray-800">{dia.dia}</div>
                              <div className="text-xs text-gray-600 mt-1">
                                {dia.registros}/{dia.total}
                              </div>
                              <div className="text-xs font-semibold text-gray-700 mt-1">
                                {dia.porcentaje}%
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                {/* Modal de Edición */}
                {editandoRegistro && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border border-gray-200">
                      <h3 className="text-xl font-bold text-gray-800 mb-4">Editar Lectura</h3>
                      <div className="space-y-4">
                        <div>
                          <p className="text-sm text-gray-600 mb-2">Local: <span className="font-semibold">{editandoRegistro.local}</span></p>
                          <p className="text-sm text-gray-600 mb-4">Inquilino: <span className="font-semibold">{editandoRegistro.inquilino}</span></p>
                          {editandoRegistro.fecha && obtenerFechaLocal(editandoRegistro.fecha) !== obtenerHoy() && (
                            <div className="bg-yellow-50 p-3 rounded-lg mb-3">
                              <p className="text-sm text-yellow-800">
                                <strong>⚠️ Corrigiendo lectura anterior</strong><br/>
                                Fecha original: {obtenerFechaLocal(editandoRegistro.fecha)}
                              </p>
                            </div>
                          )}
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Nueva Lectura (m³) *
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            value={editLectura}
                            onChange={(e) => setEditLectura(e.target.value)}
                            className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                            placeholder="Ej: 1234.56"
                          />
                        </div>
                        <div className="flex gap-4 pt-4">
                          <button
                            onClick={guardarEdicion}
                            disabled={loading}
                            className="flex-1 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105"
                          >
                            {loading ? 'Guardando...' : 'Guardar Cambios'}
                          </button>
                          <button
                            onClick={cancelarEdicion}
                            disabled={loading}
                            className="flex-1 bg-gray-500 hover:bg-gray-600 disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105"
                          >
                            Cancelar
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          }

          // ========== VISTA DE GUARDIA ==========
          const progreso = calcularProgreso();

          return (
            <div className="min-h-screen bg-gray-50 p-4">
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-200">
                  <div className="flex justify-between items-center mb-6">
                    <div>
                      <h1 className="text-2xl font-bold text-azul-lgm mb-2">Registro de Medidores</h1>
                      <p className="text-gray-600">Hola, <span className="font-semibold text-verde-lgm">{user.nombre}</span></p>
                    </div>
                    <div className="flex items-center gap-3">
                      {isOnline ? (
                        <span className="flex items-center gap-1 text-green-600 text-sm bg-green-50 px-3 py-1 rounded-full">
                          <Wifi className="w-4 h-4" />
                          {firebaseInitialized ? 'Firebase' : 'Local'}
                        </span>
                      ) : (
                        <span className="flex items-center gap-1 text-orange-600 text-sm bg-orange-50 px-3 py-1 rounded-full">
                          <WifiOff className="w-4 h-4" />
                          Offline
                        </span>
                      )}
                      <button
                        onClick={() => { setUser(null); setView('login'); }}
                        className="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl transition-all transform hover:scale-105"
                      >
                        <LogOut className="w-4 h-4" />
                        Salir
                      </button>
                    </div>
                  </div>

                  {syncStatus && (
                    <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-800">
                      {syncStatus}
                    </div>
                  )}

                  {firebaseError && (
                    <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-800">
                      {firebaseError}
                    </div>
                  )}

                  <div className="bg-blue-50 p-4 rounded-xl mb-6 border border-gray-200">
                    <p className="text-sm text-gray-700 mb-2">Progreso de hoy: {progreso.completados} / {progreso.total} locales</p>
                    <div className="w-full bg-gray-200 rounded-full h-3">
                      <div
                        className="bg-verde-lgm h-3 rounded-full transition-all duration-500 shadow-lg"
                        style={{ width: `${progreso.porcentaje}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* SECCIÓN DE CORRECCIÓN DE LECTURAS ANTERIORES */}
                  <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl mb-6">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-lg font-semibold text-yellow-800 flex items-center gap-2">
                        <History className="w-5 h-5" />
                        ¿Necesita corregir una lectura anterior?
                      </h3>
                      <button
                        onClick={() => setMostrarHistorial(!mostrarHistorial)}
                        className="text-sm text-yellow-700 underline"
                      >
                        {mostrarHistorial ? 'Ocultar' : 'Mostrar'}
                      </button>
                    </div>
                    
                    {mostrarHistorial && (
                      <div className="space-y-4 mt-3">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-sm font-medium text-yellow-700 mb-2">
                              Fecha a corregir *
                            </label>
                            <input
                              type="date"
                              value={fechaCorreccion}
                              onChange={(e) => setFechaCorreccion(e.target.value)}
                              max={obtenerHoy()}
                              className="w-full px-4 py-2 border border-yellow-300 rounded-lg"
                            />
                          </div>
                          
                          <div>
                            <label className="block text-sm font-medium text-yellow-700 mb-2">
                              Local a corregir *
                            </label>
                            <select
                              value={localCorreccion}
                              onChange={(e) => setLocalCorreccion(e.target.value)}
                              className="w-full px-4 py-2 border border-yellow-300 rounded-lg"
                            >
                              <option value="">-- Seleccione un local --</option>
                              {locales.map(local => (
                                <option key={local.numero} value={local.numero}>
                                  {local.numero} - {local.inquilino}
                                </option>
                              ))}
                            </select>
                          </div>
                        </div>
                        
                        {fechaCorreccion && localCorreccion && (
                          <div className="mt-4">
                            <h4 className="font-semibold mb-2 text-yellow-800">Registros encontrados:</h4>
                            {buscarRegistrosCorreccion().length === 0 ? (
                              <p className="text-sm text-yellow-700 bg-yellow-100 p-3 rounded-lg">
                                No se encontraron registros para {localCorreccion} el {fechaCorreccion}
                              </p>
                            ) : (
                              buscarRegistrosCorreccion().map(registro => (
                                <div key={registro.id || registro.firebaseId} 
                                     className="border border-yellow-300 rounded-lg p-3 mb-2 bg-white">
                                  <div className="flex justify-between items-start">
                                    <div>
                                      <p className="font-medium">Lectura actual: <span className="font-bold">{registro.lectura} m³</span></p>
                                      <p className="text-sm text-gray-600">
                                        Hora: {new Date(registro.fecha).toLocaleTimeString()}
                                      </p>
                                      {registro.fechaCorreccion && (
                                        <p className="text-xs text-blue-600">
                                          Ya fue corregido el {new Date(registro.fechaCorreccion).toLocaleDateString()}
                                        </p>
                                      )}
                                    </div>
                                    <button
                                      onClick={() => {
                                        iniciarEdicion(registro);
                                        setMostrarHistorial(false);
                                      }}
                                      className="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg text-sm transition-colors"
                                    >
                                      Corregir
                                    </button>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>
                        )}
                      </div>
                    )}
                    
                    <p className="text-sm text-yellow-700 mt-3">
                      <strong>Nota:</strong> Puede corregir lecturas de días anteriores seleccionando la fecha y el local.
                    </p>
                  </div>

                  {error && (
                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start gap-2 mb-4">
                      <AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                      <span className="text-sm">{error}</span>
                    </div>
                  )}

                  {success && (
                    <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl flex items-start gap-2 mb-4">
                      <CheckCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                      <span className="text-sm">{success}</span>
                    </div>
                  )}

                  <div className="space-y-6">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Buscar Local o Inquilino
                      </label>
                      <div className="relative">
                        <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" />
                        <input
                          type="text"
                          value={searchTerm}
                          onChange={(e) => setSearchTerm(e.target.value)}
                          className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                          placeholder="Ej: 25, Equindeca, Baños..."
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Seleccionar Local *
                      </label>
                      <select
                        value={selectedLocal}
                        onChange={(e) => setSelectedLocal(e.target.value)}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                      >
                        <option value="">-- Seleccione un local --</option>
                        {filteredLocales.map(local => {
                          const hoy = obtenerHoy();
                          const yaRegistrado = registros.find(r => {
                            if (!r.fecha) return false;
                            const fechaRegistro = obtenerFechaLocal(r.fecha);
                            return String(r.local) === String(local.numero) && 
                                   fechaRegistro === hoy;
                          });
                          const etiqueta = local.grupo ? `${local.numero} (Medidor Compartido)` : local.numero;
                          return (
                            <option key={local.numero} value={local.numero} disabled={yaRegistrado}>
                              {etiqueta} - {local.inquilino} {yaRegistrado ? '✓' : ''}
                              {local.ultimaLectura > 0 ? ` (${local.ultimaLectura} m³)` : ''}
                            </option>
                          );
                        })}
                      </select>
                      {searchTerm && filteredLocales.length === 0 && (
                        <p className="text-sm text-gray-500 mt-2">No se encontraron locales</p>
                      )}
                    </div>

                    {selectedLocal && (
                      <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl">
                        <p className="text-sm text-yellow-800">
                          <strong>Local {selectedLocal} - {locales.find(l => String(l.numero) === String(selectedLocal))?.inquilino}</strong>
                          <br />
                          Última lectura: {locales.find(l => String(l.numero) === String(selectedLocal))?.ultimaLectura || 0} m³
                          {locales.find(l => String(l.numero) === String(selectedLocal))?.fechaUltimaLectura && (
                            <span className="block text-xs mt-1">
                              Fecha: {new Date(locales.find(l => String(l.numero) === String(selectedLocal)).fechaUltimaLectura).toLocaleDateString()}
                            </span>
                          )}
                        </p>
                      </div>
                    )}

                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Lectura del Medidor (m³) *
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        value={lectura}
                        onChange={(e) => setLectura(e.target.value)}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                        placeholder="Ej: 1234.56"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Foto del Medidor (opcional)
                      </label>
                      <input
                        id="foto-input"
                        type="file"
                        accept="image/*"
                        capture="environment"
                        onChange={handleFileChange}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                      />
                      {foto && (
                        <div className="mt-4">
                          <img src={foto} alt="Preview" className="w-full max-h-64 object-contain rounded-xl border border-gray-300 shadow-sm" />
                        </div>
                      )}
                    </div>

                    <button
                      onClick={handleSubmit}
                      disabled={loading}
                      className="w-full flex items-center justify-center gap-2 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105 shadow-lg"
                    >
                      <Camera className="w-5 h-5" />
                      {loading ? 'Guardando...' : 'Registrar Lectura'}
                    </button>

                    {!isOnline && (
                      <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-xl">
                        <p className="text-sm text-yellow-800 text-center">
                          <strong>Modo Offline</strong> - Los registros se guardan localmente y se sincronizarán automáticamente cuando recuperes la conexión.
                        </p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                  <div className="flex justify-between items-center mb-4">
                    <h2 className="text-xl font-bold text-gray-800">Mis Registros</h2>
                    <div className="flex items-center gap-2">
                      <label className="text-sm text-gray-700">Ver fecha:</label>
                      <input
                        type="date"
                        value={fechaFiltroGuardia}
                        onChange={(e) => setFechaFiltroGuardia(e.target.value)}
                        className="px-3 py-1 border border-gray-300 rounded-lg"
                      />
                    </div>
                  </div>
                  <div className="space-y-3">
                    {registros
                      .filter(r => {
                        if (!r.fecha) return false;
                        const fechaRegistro = obtenerFechaLocal(r.fecha);
                        return r.username === user.username && fechaRegistro === fechaFiltroGuardia;
                      })
                      .sort(ordenarRegistros)
                      .map(r => (
                        <div key={r.firebaseId || r.id} className="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                          <div className="flex-1">
                            <p className="font-medium text-gray-800">{r.local} - {r.inquilino}</p>
                            <p className="text-sm text-gray-600">
                              {r.lectura} m³ - {r.fecha ? new Date(r.fecha).toLocaleTimeString() : 'Hora no disponible'}
                              {r.lecturaAnterior && (
                                <span className="text-red-600 ml-2">(Corregido de {r.lecturaAnterior} m³)</span>
                              )}
                            </p>
                            <p className="text-xs text-gray-500 mt-1">
                              {r.firebaseId ? (
                                <span className="text-green-600">✓ Sincronizado con Firebase</span>
                              ) : (
                                <span className="text-yellow-600">● Guardado localmente (offline)</span>
                              )}
                              {r.fechaCorreccion && (
                                <span className="text-blue-600 ml-2">● Corregido el {new Date(r.fechaCorreccion).toLocaleDateString()}</span>
                              )}
                            </p>
                          </div>
                          <div className="flex gap-2">
                            <button
                              onClick={() => iniciarEdicion(r)}
                              className="flex items-center gap-1 px-3 py-1 bg-azul-lgm hover:bg-[#1a1f45] text-white rounded-lg text-xs transition-colors"
                            >
                              <Edit className="w-3 h-3" />
                              {r.fechaCorreccion ? 'Recorregir' : 'Editar'}
                            </button>
                            <button
                              onClick={() => eliminarRegistro(r)}
                              className="flex items-center gap-1 px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs transition-colors"
                            >
                              <Trash className="w-3 h-3" />
                              Eliminar
                            </button>
                          </div>
                        </div>
                      ))}
                    {registros.filter(r => {
                      if (!r.fecha) return false;
                      const fechaRegistro = obtenerFechaLocal(r.fecha);
                      return r.username === user.username && fechaRegistro === fechaFiltroGuardia;
                    }).length === 0 && (
                      <p className="text-center text-gray-500 py-4">
                        {fechaFiltroGuardia === obtenerHoy() 
                          ? 'No has registrado ningún local hoy' 
                          : `No hay registros para el ${fechaFiltroGuardia}`}
                      </p>
                    )}
                  </div>
                </div>

                {/* Modal de Edición para Guardia */}
                {editandoRegistro && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border border-gray-200">
                      <h3 className="text-xl font-bold text-gray-800 mb-4">
                        {editandoRegistro.fecha && obtenerFechaLocal(editandoRegistro.fecha) !== obtenerHoy() 
                          ? 'Corregir Lectura Anterior' 
                          : 'Editar Lectura'}
                      </h3>
                      <div className="space-y-4">
                        <div>
                          <p className="text-sm text-gray-600 mb-2">Local: <span className="font-semibold">{editandoRegistro.local}</span></p>
                          <p className="text-sm text-gray-600 mb-4">Inquilino: <span className="font-semibold">{editandoRegistro.inquilino}</span></p>
                          {editandoRegistro.fecha && obtenerFechaLocal(editandoRegistro.fecha) !== obtenerHoy() && (
                            <div className="bg-yellow-50 p-3 rounded-lg mb-3">
                              <p className="text-sm text-yellow-800">
                                <strong>⚠️ Corrigiendo lectura anterior</strong><br/>
                                Fecha original: {obtenerFechaLocal(editandoRegistro.fecha)}
                                {editandoRegistro.fechaCorreccion && (
                                  <span className="block">
                                    Última corrección: {new Date(editandoRegistro.fechaCorreccion).toLocaleDateString()}
                                  </span>
                                )}
                              </p>
                            </div>
                          )}
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Nueva Lectura (m³) *
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            value={editLectura}
                            onChange={(e) => setEditLectura(e.target.value)}
                            className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm focus:border-transparent transition-all"
                            placeholder="Ej: 1234.56"
                          />
                          {editandoRegistro.lectura && (
                            <p className="text-sm text-gray-500 mt-1">
                              Lectura actual: {editandoRegistro.lectura} m³
                            </p>
                          )}
                        </div>
                        <div className="flex gap-4 pt-4">
                          <button
                            onClick={guardarEdicion}
                            disabled={loading}
                            className="flex-1 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105"
                          >
                            {loading ? 'Guardando...' : editandoRegistro.fecha && obtenerFechaLocal(editandoRegistro.fecha) !== obtenerHoy() ? 'Corregir' : 'Guardar'}
                          </button>
                          <button
                            onClick={cancelarEdicion}
                            disabled={loading}
                            className="flex-1 bg-gray-500 hover:bg-gray-600 disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105"
                          >
                            Cancelar
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<MedidorApp />, document.getElementById('root'));
    </script>
</body>
</html>
</html>
