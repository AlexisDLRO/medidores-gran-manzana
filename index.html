        // ---------- UTILIDADES ----------
        const obtenerFechaLocal = (fechaISO) => {
            if (!fechaISO) return '';
            const fecha = new Date(fechaISO);
            return new Date(fecha.getTime() - fecha.getTimezoneOffset()*60000).toISOString().split('T')[0];
        };
        const obtenerHoy = () => obtenerFechaLocal(new Date().toISOString());

            const ia = localesData.findIndex(l => String(l.numero) === String(a.numero));
            const ib = localesData.findIndex(l => String(l.numero) === String(b.numero));
            return ia - ib;
        };

            const ia = localesData.findIndex(l => String(l.numero) === String(a.local));
            const ib = localesData.findIndex(l => String(l.numero) === String(b.local));
            return ia - ib;
        };

        // ---------- IMAGEN ----------
        const comprimirImagen = (file, maxWidth=600, quality=0.5) => new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(blob => {
                        const r2 = new FileReader();
                        r2.onloadend = () => res(r2.result);
                        r2.onerror = rej;
                        r2.readAsDataURL(blob);
                    }, 'image/jpeg', quality);
                };
                img.onerror = rej;
                img.src = e.target.result;
            };
            reader.onerror = rej;
            reader.readAsDataURL(file);
        });
        const comprimirImagenNoBloqueante = (file) => new Promise(res => {
            if ('requestIdleCallback' in window) requestIdleCallback(async () => res(await comprimirImagen(file)), { timeout:2000 });
            else setTimeout(async () => res(await comprimirImagen(file)), 50);
        });

        // ---------- FIREBASE (solo últimos 30 días) ----------
        const cargarRegistrosRecientes = (callback) => {
            if (!firebaseInitialized || !database) return;
            const limite = new Date(Date.now() - 30*86400000).toISOString();
            database.ref('registros').orderByChild('fecha').startAt(limite).once('value', snap => {
                const data = snap.val();
                callback(data ? Object.keys(data).map(k => ({ firebaseId: k, ...data[k] })).sort(ordenarRegistros) : []);
            });
        };
        const guardarRegistroFirebase = async (r) => {
            if (!firebaseInitialized || !database) throw new Error('Firebase no disponible');
            await database.ref('registros').push().set(r);
        };
        const guardarEnFirebaseEnSegundoPlano = (r) => {
            if (!firebaseInitialized || !database || !navigator.onLine) return;
            queueMicrotask(async () => {
                try { await guardarRegistroFirebase(r); eliminarRegistroLocal(r.id); }
                catch (e) { console.warn('Firebase offline'); }
            });
        };
        const actualizarRegistroFirebase = async (id, datos) => {
            if (!firebaseInitialized || !database) throw new Error('Firebase no disponible');
            await database.ref(`registros/${id}`).update(datos);
        };
        const eliminarRegistroFirebase = async (id) => {
            if (!firebaseInitialized || !database) throw new Error('Firebase no disponible');
            await database.ref(`registros/${id}`).remove();
        };

        // ---------- COMPONENTES MEMOIZADOS (guardia) ----------
        const SelectLocal = memo(({ locales, registros, selectedLocal, onChange, searchTerm, onSearchChange }) => {

            const opciones = useMemo(() => {
                if (!searchTerm) return locales.slice(0, 50);
                const term = searchTerm.toLowerCase();
                return locales.filter(l => 
                    String(l.numero).toLowerCase().includes(term) || 
                    l.inquilino.toLowerCase().includes(term)
                ).slice(0, 50);
            }, [locales, searchTerm]);
            return (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Buscar / Seleccionar Local</label>
                    <input list="locales-list" value={selectedLocal} onChange={e => onChange(e.target.value)} onInput={e => onSearchChange(e.target.value)}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" placeholder="Escriba número o inquilino" />
                    <datalist id="locales-list">
                        {opciones.map(l => {
                            const ya = registros.some(r => String(r.local) === String(l.numero) && obtenerFechaLocal(r.fecha) === hoy);
                            return <option key={l.numero} value={l.numero}>{l.numero} - {l.inquilino} {ya ? '✓' : ''} {l.ultimaLectura ? `(${l.ultimaLectura} m³)` : ''}</option>;
                        })}
                    </datalist>
                    {searchTerm && opciones.length===0 && <p className="text-sm text-gray-500 mt-2">No se encontraron locales</p>}
                </div>
            );
        });

        const ImageUploader = memo(({ foto, onFileChange, loading }) => (
            <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">Foto del Medidor (opcional)</label>
                <input id="foto-input" type="file" accept="image/*" capture="environment" onChange={onFileChange} disabled={loading}
                    className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" />
                {foto && <div className="mt-4"><img src={foto} alt="Preview" className="w-full max-h-64 object-contain rounded-xl border border-gray-300 shadow-sm" /></div>}
            </div>
        ));

        const EditModal = memo(({ editandoRegistro, editLectura, setEditLectura, onGuardar, onCancelar, loading }) => {
            if (!editandoRegistro) return null;
            const esCorreccionPasada = editandoRegistro.fecha && obtenerFechaLocal(editandoRegistro.fecha) !== obtenerHoy();
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
                        <h3 className="text-xl font-bold text-gray-800 mb-4">{esCorreccionPasada ? 'Corregir Lectura Anterior' : 'Editar Lectura'}</h3>
                        <div className="space-y-4">
                            <p className="text-sm text-gray-600">Local: <span className="font-semibold">{editandoRegistro.local}</span></p>
                            {esCorreccionPasada && <div className="bg-yellow-50 p-3 rounded-lg"><p className="text-sm text-yellow-800"><strong>⚠️ Corrigiendo lectura anterior</strong><br/>Fecha original: {obtenerFechaLocal(editandoRegistro.fecha)}</p></div>}
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Nueva Lectura (m³) *</label>
                                <input type="number" step="0.01" value={editLectura} onChange={e => setEditLectura(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" />
                                {editandoRegistro.lectura && <p className="text-sm text-gray-500 mt-1">Lectura actual: {editandoRegistro.lectura} m³</p>}
                            </div>
                            <div className="flex gap-4 pt-4">
                                <button onClick={onGuardar} disabled={loading} className="flex-1 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all">
                                    {loading ? 'Guardando...' : esCorreccionPasada ? 'Corregir' : 'Guardar'}
                                </button>
                                <button onClick={onCancelar} disabled={loading} className="flex-1 bg-gray-500 hover:bg-gray-600 disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        });

        // ---------- COMPONENTES DEL ADMIN (memoizados) ----------
        const AdminDashboard = memo(({ registros, locales }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const consumoMensual = useMemo(() => {
                const map = {};
                registros.forEach(r => {
                    if (!r.fecha || !r.lectura) return;
                    const fecha = new Date(r.fecha);
                    const mes = fecha.getMonth();
                    const anio = fecha.getFullYear();
                    const key = `${anio}-${mes}`;
                    const local = locales.find(l => String(l.numero) === String(r.local));
                    if (local && local.ultimaLectura) {
                        const consumo = r.lectura - local.ultimaLectura;
                        if (consumo > 0 && consumo < 10000) {
                            if (!map[key]) map[key] = { mes, anio, total: 0, registros:0 };
                            map[key].total += consumo;
                            map[key].registros++;
                        }
                    }
                });
                return Object.values(map).sort((a,b) => a.anio-b.anio || a.mes-b.mes);
            }, [registros, locales]);

            const top10 = useMemo(() => {
                const cons = {};
                registros.forEach(r => {
                    if (!r.fecha || !r.lectura) return;
                    const local = locales.find(l => String(l.numero) === String(r.local));
                    if (local && local.ultimaLectura) {
                        const consumo = r.lectura - local.ultimaLectura;
                        if (consumo > 0 && consumo < 10000) {
                            if (!cons[r.local]) cons[r.local] = { local: r.local, inquilino: r.inquilino, consumoTotal: 0, registros: 0 };
                            cons[r.local].consumoTotal += consumo;
                            cons[r.local].registros++;
                        }
                    }
                });
                return Object.values(cons).sort((a,b) => b.consumoTotal - a.consumoTotal).slice(0,10);
            }, [registros, locales]);

            useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: consumoMensual.map(c => `${meses[c.mes]} ${c.anio}`),
                            datasets: [{
                                label: 'Consumo Total (m³)',
                                data: consumoMensual.map(c => c.total.toFixed(2)),
                                backgroundColor: 'rgba(145,150,119,0.6)',
                                borderColor: 'rgba(145,150,119,1)',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display:true }, title: { display:true, text:'Consumo Mensual de Agua' } },
                            scales: { y: { beginAtZero:true, title: { display:true, text:'Metros Cúbicos (m³)' } } }
                        }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [consumoMensual]);

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2"><BarChart className="w-6 h-6 text-verde-lgm" /> Consumo Mensual de Agua</h2>
                        <div style={{ height: '400px' }}><canvas ref={chartRef}></canvas></div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2"><Award className="w-6 h-6 text-yellow-500" /> Top 10 Locales con Mayor Consumo</h2>
                        {top10.length === 0 ? <p className="text-center text-gray-500 py-8">No hay datos suficientes</p> : (
                            <div className="space-y-3">
                                {top10.map((item, idx) => (
                                    <div key={item.local} className="flex items-center justify-between p-4 bg-gradient-to-r from-verde-lgm to-azul-lgm text-white rounded-xl shadow-md">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-white text-azul-lgm w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg">{idx+1}</div>
                                            <div><p className="font-semibold text-lg">Local {item.local} - {item.inquilino}</p><p className="text-sm opacity-90">{item.registros} registros</p></div>
                                        </div>
                                        <div className="text-right"><p className="text-2xl font-bold">{item.consumoTotal.toFixed(2)} m³</p><p className="text-sm opacity-90">consumo total</p></div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        });

        const AdminAlertas = memo(({ registros, locales }) => {
            const anomalias = useMemo(() => {
                const res = [];
                const hoy = obtenerHoy();
                registros.forEach(r => {
                    if (!r.fecha || !r.lectura) return;
                    const fechaReg = obtenerFechaLocal(r.fecha);
                    if ((new Date(hoy) - new Date(fechaReg)) > 7*86400000) return;
                    const local = locales.find(l => String(l.numero) === String(r.local));
                    if (!local || !local.ultimaLectura) return;
                    const consumo = r.lectura - local.ultimaLectura;
                    if (consumo < 0) res.push({ tipo:'error', local:r.local, inquilino:r.inquilino, mensaje:`Lectura menor a anterior (${local.ultimaLectura} → ${r.lectura})`, fecha:fechaReg, severidad:'alta' });
                    else if (consumo > 500) res.push({ tipo:'warning', local:r.local, inquilino:r.inquilino, mensaje:`Consumo muy alto: ${consumo.toFixed(2)} m³`, fecha:fechaReg, severidad:'alta' });
                    else if (consumo > 200) res.push({ tipo:'warning', local:r.local, inquilino:r.inquilino, mensaje:`Consumo elevado: ${consumo.toFixed(2)} m³`, fecha:fechaReg, severidad:'media' });
                    else if (consumo === 0) res.push({ tipo:'info', local:r.local, inquilino:r.inquilino, mensaje:'Sin consumo', fecha:fechaReg, severidad:'baja' });
                });
                return res.sort((a,b) => ({ alta:0,media:1,baja:2 }[a.severidad] - { alta:0,media:1,baja:2 }[b.severidad]));
            }, [registros, locales]);

            return (
                <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2"><AlertTriangle className="w-6 h-6 text-red-500" /> Alertas de Lecturas Anómalas (Últimos 7 días)</h2>
                    {anomalias.length === 0 ? (
                        <div className="text-center py-12"><CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-4" /><p className="text-xl font-semibold text-gray-700">¡Todo en orden!</p><p className="text-gray-500">No se detectaron anomalías</p></div>
                    ) : (
                        <div className="space-y-3">
                            {anomalias.map((a,i) => {
                                let bg = 'bg-gray-50', border = 'border-gray-200', icon = 'text-gray-600';
                                if (a.severidad === 'alta') { bg='bg-red-50'; border='border-red-300'; icon='text-red-600'; }
                                else if (a.severidad === 'media') { bg='bg-yellow-50'; border='border-yellow-300'; icon='text-yellow-600'; }
                                else { bg='bg-blue-50'; border='border-blue-300'; icon='text-blue-600'; }
                                return (
                                    <div key={i} className={`${bg} border ${border} p-4 rounded-xl`}>
                                        <div className="flex items-start gap-3">
                                            <AlertTriangle className={`w-6 h-6 ${icon} flex-shrink-0 mt-1`} />
                                            <div className="flex-1">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div><p className="font-semibold text-gray-800">Local {a.local} - {a.inquilino}</p><p className="text-sm text-gray-600">{a.mensaje}</p></div>
                                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold ${a.severidad==='alta'?'bg-red-200 text-red-800':a.severidad==='media'?'bg-yellow-200 text-yellow-800':'bg-blue-200 text-blue-800'}`}>{a.severidad.toUpperCase()}</span>
                                                </div>
                                                <p className="text-xs text-gray-500">Fecha: {a.fecha}</p>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        });

        const AdminHistorial = memo(({ registros }) => {
            const correcciones = useMemo(() => {
                return registros.filter(r => r.fechaCorreccion).sort((a,b) => new Date(b.fechaCorreccion) - new Date(a.fechaCorreccion)).slice(0,50);
            }, [registros]);
            return (
                <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2"><History className="w-6 h-6 text-blue-600" /> Historial de Correcciones (Últimas 50)</h2>
                    {correcciones.length === 0 ? <p className="text-center text-gray-500 py-12">No hay correcciones registradas</p> : (
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-gray-50"><tr><th className="px-4 py-3 text-left text-sm font-semibold">Fecha Corrección</th><th className="px-4 py-3 text-left text-sm font-semibold">Local</th><th className="px-4 py-3 text-left text-sm font-semibold">Inquilino</th><th className="px-4 py-3 text-left text-sm font-semibold">Lectura Original</th><th className="px-4 py-3 text-left text-sm font-semibold">Lectura Corregida</th><th className="px-4 py-3 text-left text-sm font-semibold">Corregido Por</th><th className="px-4 py-3 text-left text-sm font-semibold">Fecha Original</th></tr></thead>
                                <tbody className="divide-y divide-gray-200">
                                    {correcciones.map((r,i) => (
                                        <tr key={r.firebaseId||r.id||i} className="hover:bg-gray-50">
                                            <td className="px-4 py-3 text-sm text-gray-700">{new Date(r.fechaCorreccion).toLocaleString('es-EC')}</td>
                                            <td className="px-4 py-3 text-sm font-medium text-gray-900">{r.local}</td>
                                            <td className="px-4 py-3 text-sm text-gray-700">{r.inquilino}</td>
                                            <td className="px-4 py-3 text-sm text-red-600 font-semibold">{r.lecturaAnterior} m³</td>
                                            <td className="px-4 py-3 text-sm text-green-600 font-semibold">{r.lectura} m³</td>
                                            <td className="px-4 py-3 text-sm text-gray-700">{r.corregidoPor}</td>
                                            <td className="px-4 py-3 text-sm text-gray-500">{new Date(r.fecha).toLocaleDateString('es-EC')}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        });

        const AdminCalendario = memo(({ registros, locales, mesSeleccionado, anioSeleccionado }) => {
            const dias = useMemo(() => {
                const primerDia = new Date(anioSeleccionado, mesSeleccionado, 1);
                const ultimoDia = new Date(anioSeleccionado, mesSeleccionado+1, 0);
                const celdas = [];
                for (let i=0; i<primerDia.getDay(); i++) celdas.push(null);
                for (let d=1; d<=ultimoDia.getDate(); d++) {
                    const fecha = `${anioSeleccionado}-${String(mesSeleccionado+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const regsDia = registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha) === fecha);
                    const porcentaje = (regsDia.length / locales.length) * 100;
                    let estado = 'empty';
                    if (porcentaje >= 90) estado = 'complete';
                    else if (porcentaje >= 50) estado = 'partial';
                    celdas.push({ dia:d, fecha, registros:regsDia.length, total:locales.length, porcentaje:Math.round(porcentaje), estado });
                }
                return celdas;
            }, [registros, locales, mesSeleccionado, anioSeleccionado]);

            return (
                <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><Calendar className="w-6 h-6 text-verde-lgm" /> Calendario de Lecturas</h2>
                    </div>
                    <div className="flex flex-wrap gap-4 mb-6 p-4 bg-gray-50 rounded-lg">
                        <div className="flex items-center gap-2"><div className="w-6 h-6 bg-green-200 border border-green-400 rounded"></div><span className="text-sm">≥ 90%</span></div>
                        <div className="flex items-center gap-2"><div className="w-6 h-6 bg-yellow-200 border border-yellow-400 rounded"></div><span className="text-sm">50-89%</span></div>
                        <div className="flex items-center gap-2"><div className="w-6 h-6 bg-red-200 border border-red-400 rounded"></div><span className="text-sm">{'<'} 50%</span></div>
                    </div>
                    <div className="grid grid-cols-7 gap-2">
                        {['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d => <div key={d} className="text-center font-semibold text-gray-700 py-2">{d}</div>)}
                        {dias.map((d,i) => {
                            if (!d) return <div key={`e-${i}`} className="calendar-day"></div>;
                            let bg = 'calendar-day-empty';
                            if (d.estado === 'complete') bg = 'calendar-day-complete';
                            else if (d.estado === 'partial') bg = 'calendar-day-partial';
                            return (
                                <div key={d.dia} className={`calendar-day ${bg} p-2 rounded-lg`}>
                                    <div className="font-bold text-gray-800">{d.dia}</div>
                                    <div className="text-xs text-gray-600 mt-1">{d.registros}/{d.total}</div>
                                    <div className="text-xs font-semibold text-gray-700 mt-1">{d.porcentaje}%</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        });

        // ---------- VISTA LOGIN ----------
        const LoginView = memo(({ onLogin, isOnline, firebaseInitialized, firebaseError }) => {
            const [user, setUser] = useState(''); const [pass, setPass] = useState(''); const [nombre, setNombre] = useState(''); const [error, setError] = useState('');
            const handle = () => {
                const usuarios = { guardia: { password:'1234', rol:'guardia' }, admin: { password:'admin123', nombre:'Administrador', rol:'admin' } };
                if (user === 'guardia') {
                    if (usuarios.guardia.password === pass) { if (!nombre.trim()) { setError('Ingrese nombre'); return; } onLogin({ username:user, nombre:nombre.trim(), rol:'guardia' }); }
                    else setError('Contraseña incorrecta');
                } else if (usuarios[user] && usuarios[user].password === pass) onLogin({ username:user, ...usuarios[user] });
                else setError('Usuario o contraseña incorrectos');
            };
            return (
                <div className="min-h-screen bg-azul-lgm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-azul-lgm mb-2">La Gran Manzana</h1>
                            <div className="text-sm text-gray-600"><p className="font-semibold">Centro Comercial</p><p>Sistema de Registro de Medidores</p></div>
                            <div className="mt-3 flex items-center justify-center gap-2">
                                {isOnline ? <span className="flex items-center gap-1 text-green-600 text-sm"><Wifi className="w-4 h-4" />{firebaseInitialized?'Conectado':'Local'}</span> : <span className="flex items-center gap-1 text-orange-600 text-sm"><WifiOff className="w-4 h-4" />Sin conexión</span>}
                            </div>
                            {firebaseError && <div className="mt-2 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{firebaseError}</div>}
                        </div>
                        <div className="space-y-4">
                            <input type="text" value={user} onChange={e=>setUser(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handle()} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" placeholder="Usuario" />
                            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handle()} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" placeholder="Contraseña" />
                            {user === 'guardia' && <input type="text" value={nombre} onChange={e=>setNombre(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handle()} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" placeholder="Nombre completo" />}
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start gap-2"><AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" /><span className="text-sm">{error}</span></div>}
                            <button onClick={handle} className="w-full bg-verde-lgm hover:bg-[#7a8560] text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105 shadow-lg">Iniciar Sesión</button>
                        </div>
                        <div className="mt-6 p-4 bg-gray-50 rounded-xl text-sm text-gray-600"><p className="font-semibold mb-2">Credenciales:</p><p><strong>Guardias:</strong> guardia / 1234</p><p className="text-xs text-gray-500 mt-1">* Ingrese nombre completo</p></div>
                    </div>
                </div>
            );
        });

        // ---------- APP PRINCIPAL ----------
        const MedidorApp = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [locales, setLocales] = useState([]);
            const [selectedLocal, setSelectedLocal] = useState('');
            const [lectura, setLectura] = useState('');
            const [foto, setFoto] = useState(null);
            const [registros, setRegistros] = useState([]);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [loading, setLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [debouncedSearch, setDebouncedSearch] = useState('');
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [syncStatus, setSyncStatus] = useState('');
            const [firebaseError, setFirebaseError] = useState('');
            const [editandoRegistro, setEditandoRegistro] = useState(null);
            const [editLectura, setEditLectura] = useState('');
            const [fechaInicio, setFechaInicio] = useState('');
            const [fechaFin, setFechaFin] = useState('');
            const [syncing, setSyncing] = useState(false);
            const [fechaFiltroGuardia, setFechaFiltroGuardia] = useState('');
            const [mostrarHistorial, setMostrarHistorial] = useState(false);
            const [localCorreccion, setLocalCorreccion] = useState('');
            const [fechaCorreccion, setFechaCorreccion] = useState('');
            // Admin
            const [activeTab, setActiveTab] = useState('registros');
            const [mesSeleccionado, setMesSeleccionado] = useState(new Date().getMonth());
            const [anioSeleccionado, setAnioSeleccionado] = useState(new Date().getFullYear());

            useEffect(() => { const t = setTimeout(() => setDebouncedSearch(searchTerm), 200); return () => clearTimeout(t); }, [searchTerm]);

            // Carga inicial
            useEffect(() => {
                const base = localesData.map(l => ({ ...l, ultimaLectura:0, fechaUltimaLectura:null }));
                const saved = localStorage.getItem('locales-gran-manzana');
                if (saved) try {
                    JSON.parse(saved).forEach(s => { const idx = base.findIndex(b => String(b.numero)===String(s.numero)); if(idx!==-1 && s.ultimaLectura) { base[idx].ultimaLectura = s.ultimaLectura; base[idx].fechaUltimaLectura = s.fechaUltimaLectura; } });
                } catch {}
                setLocales(base);
                setRegistros(cargarRegistrosLocales().sort(ordenarRegistros));
                if (firebaseInitialized) {
                    cargarRegistrosRecientes(fbRegs => setRegistros(prev => [...prev.filter(r=>!r.firebaseId), ...fbRegs].sort(ordenarRegistros)));
                    const ref = database.ref('registros').orderByChild('fecha').startAt(new Date(Date.now()-30*86400000).toISOString());
                    const listener = ref.on('value', snap => {
                        const data = snap.val();
                        if (data) setRegistros(prev => [...prev.filter(r=>!r.firebaseId), ...Object.keys(data).map(k=>({firebaseId:k,...data[k]}))].sort(ordenarRegistros));
                    }, err => setFirebaseError(err.message));
                    return () => ref.off('value', listener);
                }
            }, []);

            useEffect(() => {
                const goOnline = () => { setIsOnline(true); setSyncStatus('Conectado - Sincronizando...'); sincronizarRegistrosOffline(); };
                const goOffline = () => { setIsOnline(false); setSyncStatus('Modo offline'); setTimeout(()=>setSyncStatus(''),3000); };
                window.addEventListener('online', goOnline); window.addEventListener('offline', goOffline);
                return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
            }, []);

            useEffect(() => { if (user && view==='registro') setFechaFiltroGuardia(obtenerHoy()); }, [user, view]);

            const sincronizarRegistrosOffline = useCallback(async () => {
                if (!firebaseInitialized || !database || !isOnline) return;
                setSyncing(true); setSyncStatus('Sincronizando...');
                const offline = cargarRegistrosLocales();
                let ok=0, err=0;
                for (const r of offline) {
                    try { await guardarRegistroFirebase(r); eliminarRegistroLocal(r.id); ok++; } catch { err++; }
                }
                setSyncStatus(`Sincronizados: ${ok}, errores: ${err}`); setTimeout(()=>setSyncStatus(''),3000);
                if (ok>0) cargarRegistrosRecientes(fb => setRegistros(prev => [...prev.filter(p=>!p.firebaseId), ...fb].sort(ordenarRegistros)));
                setSyncing(false);
            }, [isOnline]);

            const validarLectura = useCallback((lect, localId, excl=null, esCorreccion=false) => {
                const local = locales.find(l=>String(l.numero)===String(localId));
                const num = parseFloat(lect);
                if (!localId) return 'Debe seleccionar un local';
                if (!lect || lect.trim()==='') return 'Ingrese lectura';
                if (isNaN(num)) return 'Número inválido';
                if (num < 0) return 'No puede ser negativa';
                if (num > 999999) return 'Lectura demasiado alta';
                if (!esCorreccion && local.ultimaLectura && num < local.ultimaLectura) return { tipo:'advertencia', mensaje:`⚠️ ADVERTENCIA\n\nLectura menor a la anterior (${local.ultimaLectura} m³).\nDiferencia: -${(local.ultimaLectura-num).toFixed(2)} m³\n\n¿Continuar?` };
                if (!esCorreccion && local.ultimaLectura && num > local.ultimaLectura+1000) return { tipo:'advertencia', mensaje:`⚠️ Consumo muy alto: ${(num-local.ultimaLectura).toFixed(2)} m³\n¿Continuar?` };
                const hoy = obtenerHoy();
                const duplicado = registros.find(r => r.fecha && obtenerFechaLocal(r.fecha)===hoy && String(r.local)===String(localId) && (!excl || (r.firebaseId!==excl.firebaseId && r.id!==excl.id)));
                if (duplicado && !esCorreccion) return 'Este local ya fue registrado hoy';
                return null;
            }, [locales, registros]);

            const buscarRegistrosCorreccion = useCallback(() => {
                if (!fechaCorreccion || !localCorreccion) return [];
                return registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha)===fechaCorreccion && String(r.local)===String(localCorreccion) && r.username===user?.username);
            }, [registros, fechaCorreccion, localCorreccion, user]);

            const handleFileChange = useCallback(async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10000000) { setError('Foto muy grande (max 10MB)'); return; }
                setLoading(true); setError('');
                try { setFoto(await comprimirImagenNoBloqueante(file)); setSuccess('✓ Foto cargada'); setTimeout(()=>setSuccess(''),2000); }
                catch { setError('Error procesando imagen'); } finally { setLoading(false); }
            }, []);

            const handleSubmit = useCallback(async () => {
                setLoading(true); setError(''); setSuccess('');
                const v = validarLectura(lectura, selectedLocal);
                if (v) {
                    if (typeof v === 'string') { setError(v); setLoading(false); return; }
                    if (v.tipo==='advertencia' && !window.confirm(v.mensaje)) { setError('Cancelado'); setLoading(false); return; }
                }
                try {
                    const ahora = new Date().toISOString();
                    const num = parseFloat(lectura);
                    const localData = locales.find(l=>String(l.numero)===String(selectedLocal));
                    const nuevo = { id:Date.now(), local:selectedLocal, inquilino:localData.inquilino, lectura:num, foto, fecha:ahora, guardia:user.nombre, username:user.username };
                    guardarRegistroLocal(nuevo);
                    const nuevosLocales = locales.map(l => String(l.numero)===String(selectedLocal) ? {...l, ultimaLectura:num, fechaUltimaLectura:ahora} : l);
                    setLocales(nuevosLocales); guardarLocalesConDebounce(nuevosLocales);
                    setRegistros(prev => [...prev, nuevo].sort(ordenarRegistros));
                    setSelectedLocal(''); setLectura(''); setFoto(null); setSearchTerm('');
                    document.getElementById('foto-input') && (document.getElementById('foto-input').value = '');
                    setSuccess(`✓ Local ${selectedLocal} registrado`);
                    guardarEnFirebaseEnSegundoPlano(nuevo);
                } catch (err) { setError('Error al guardar: '+err.message); } finally { setLoading(false); }
            }, [lectura, selectedLocal, foto, locales, user, validarLectura]);

            const guardarEdicion = useCallback(async () => {
                if (!editandoRegistro) return;
                setLoading(true); setError(''); setSuccess('');
                const esPasada = editandoRegistro.fecha && obtenerFechaLocal(editandoRegistro.fecha) !== obtenerHoy();
                const v = validarLectura(editLectura, editandoRegistro.local, editandoRegistro, esPasada);
                if (v) {
                    if (typeof v === 'string') { setError(v); setLoading(false); return; }
                    if (v.tipo==='advertencia' && !window.confirm(v.mensaje)) { setError('Cancelado'); setLoading(false); return; }
                }
                try {
                    const num = parseFloat(editLectura);
                    const actualizado = { ...editandoRegistro, lectura:num, fechaCorreccion:new Date().toISOString(), corregidoPor:user.nombre, lecturaAnterior:editandoRegistro.lectura };
                    let ok = false;
                    if (firebaseInitialized && isOnline && editandoRegistro.firebaseId) {
                        try { await actualizarRegistroFirebase(editandoRegistro.firebaseId, { lectura:num, fechaCorreccion:actualizado.fechaCorreccion, corregidoPor:actualizado.corregidoPor, lecturaAnterior:actualizado.lecturaAnterior }); ok = true; } catch {}
                    }
                    if (!ok && editandoRegistro.id) {
                        const locs = cargarRegistrosLocales();
                        const idx = locs.findIndex(r => r.id === editandoRegistro.id);
                        if (idx !== -1) { locs[idx] = actualizado; localStorage.setItem('registros-offline-gran-manzana', JSON.stringify(locs)); ok = true; }
                    }
                    if (ok) {
                        setRegistros(prev => prev.map(r => (r.firebaseId===editandoRegistro.firebaseId || r.id===editandoRegistro.id) ? actualizado : r));
                        if (!esPasada) setLocales(prev => { const n = prev.map(l => String(l.numero)===String(editandoRegistro.local) ? {...l, ultimaLectura:num, fechaUltimaLectura:actualizado.fechaCorreccion} : l); guardarLocalesConDebounce(n); return n; });
                        setSuccess('✓ Lectura corregida'); setEditandoRegistro(null); setEditLectura('');
                    } else setError('No se pudo actualizar');
                } catch (err) { setError('Error: '+err.message); } finally { setLoading(false); }
            }, [editandoRegistro, editLectura, user, isOnline, validarLectura]);

            const eliminarRegistro = useCallback(async (reg) => {
                if (!window.confirm('¿Eliminar este registro?')) return;
                setLoading(true);
                try {
                    let ok = false;
                    if (firebaseInitialized && isOnline && reg.firebaseId) { try { await eliminarRegistroFirebase(reg.firebaseId); ok = true; } catch {} }
                    if (!ok && reg.id) ok = eliminarRegistroLocal(reg.id);
                    if (ok) { setRegistros(prev => prev.filter(r => r.firebaseId!==reg.firebaseId && r.id!==reg.id)); setSuccess('✓ Eliminado'); }
                    else setError('No se pudo eliminar');
                } catch (err) { setError('Error: '+err.message); } finally { setLoading(false); }
            }, [isOnline]);

            const exportarExcel = useCallback(() => {
                const hoy = obtenerHoy();
                const filtrados = registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha) === hoy).sort(ordenarRegistros);
                let csv = 'Fecha;Hora;Local;Inquilino;Lectura (m³);Guardia;Tiene Foto\n';
                filtrados.forEach(r => {
                    const f = new Date(r.fecha);
                    csv += `${f.toLocaleDateString('es-EC')};${f.toLocaleTimeString('es-EC')};${String(r.local).replace(/;/g,',')};${String(r.inquilino).replace(/;/g,',')};${r.lectura?.toFixed(2)??'0'};${String(r.guardia).replace(/;/g,',')};${r.foto?'Sí':'No'}\n`;
                });
                const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lecturas-${hoy}.csv`; a.click(); URL.revokeObjectURL(a.href);
            }, [registros]);

            const exportarExcelPorFechas = useCallback(() => {
                if (!fechaInicio) { setError('Seleccione fecha inicio'); return; }
                const fin = fechaFin || fechaInicio;
                const filtrados = registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha) >= fechaInicio && obtenerFechaLocal(r.fecha) <= fin).sort(ordenarRegistros);
                if (filtrados.length===0) { setError('No hay registros'); return; }
                let csv = 'Fecha;Hora;Local;Inquilino;Lectura (m³);Guardia;Tiene Foto\n';
                filtrados.forEach(r => { const f = new Date(r.fecha); csv += `${f.toLocaleDateString('es-EC')};${f.toLocaleTimeString('es-EC')};${String(r.local).replace(/;/g,',')};${String(r.inquilino).replace(/;/g,',')};${r.lectura?.toFixed(2)??'0'};${String(r.guardia).replace(/;/g,',')};${r.foto?'Sí':'No'}\n`; });
                const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lecturas-${fechaInicio}-a-${fin}.csv`; a.click(); URL.revokeObjectURL(a.href);
                setSuccess(`Excel exportado: ${filtrados.length} registros`);
            }, [registros, fechaInicio, fechaFin]);

            const progreso = useMemo(() => {
                const hoy = obtenerHoy();
                const completados = registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha)===hoy).length;
                return { completados, total: locales.length, porcentaje: locales.length ? Math.round(completados/locales.length*100) : 0 };
            }, [registros, locales]);

            if (!user) return <LoginView onLogin={(u) => { setUser(u); setView(u.rol==='admin'?'admin':'registro'); }} isOnline={isOnline} firebaseInitialized={firebaseInitialized} firebaseError={firebaseError} />;

            // ---------- VISTA ADMIN ----------
            if (view === 'admin') {
                const hoy = obtenerHoy();
                const registrosHoy = registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha)===hoy).sort(ordenarRegistros);
                const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
                return (
                    <div className="min-h-screen bg-gray-50 p-4">
                        <div className="max-w-7xl mx-auto">
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-200">
                                <div className="flex justify-between items-center mb-6">
                                    <div><h1 className="text-3xl font-bold text-azul-lgm mb-2">Panel Administrativo</h1><p className="text-gray-600">Bienvenido, <span className="font-semibold text-verde-lgm">{user.nombre}</span></p></div>
                                    <div className="flex items-center gap-3">
                                        {isOnline ? <span className="flex items-center gap-1 text-green-600 text-sm bg-green-50 px-3 py-1 rounded-full"><Wifi className="w-4 h-4" />{firebaseInitialized?'Firebase':'Local'}</span> : <span className="flex items-center gap-1 text-orange-600 text-sm bg-orange-50 px-3 py-1 rounded-full"><WifiOff className="w-4 h-4" />Offline</span>}
                                        <button onClick={() => { setUser(null); setView('login'); }} className="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl"><LogOut className="w-4 h-4" />Salir</button>
                                    </div>
                                </div>
                                {syncStatus && <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-800">{syncStatus}</div>}
                                {firebaseError && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-800">{firebaseError}</div>}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-azul-lgm text-white p-4 rounded-xl shadow-lg"><div className="flex items-center gap-3"><Calendar className="w-8 h-8 text-white" /><div><p className="text-sm opacity-90">Fecha</p><p className="text-xl font-bold">{new Date().toLocaleDateString()}</p></div></div></div>
                                    <div className="bg-verde-lgm text-white p-4 rounded-xl shadow-lg"><div className="flex items-center gap-3"><CheckCircle className="w-8 h-8 text-white" /><div><p className="text-sm opacity-90">Registrados Hoy</p><p className="text-xl font-bold">{progreso.completados} / {progreso.total}</p></div></div></div>
                                    <div className="bg-azul-lgm text-white p-4 rounded-xl shadow-lg"><div className="flex items-center gap-3"><Clock className="w-8 h-8 text-white" /><div><p className="text-sm opacity-90">Progreso</p><p className="text-xl font-bold">{progreso.porcentaje}%</p></div></div></div>
                                </div>
                                <div className="mb-6"><div className="w-full bg-gray-200 rounded-full h-4"><div className="bg-verde-lgm h-4 rounded-full transition-all duration-500 shadow-lg" style={{width:`${progreso.porcentaje}%`}}></div></div></div>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={()=>setActiveTab('registros')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab==='registros'?'tab-active':'tab-inactive hover:bg-gray-200'}`}>📋 Registros</button>
                                    <button onClick={()=>setActiveTab('dashboard')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab==='dashboard'?'tab-active':'tab-inactive hover:bg-gray-200'}`}>📈 Dashboard</button>
                                    <button onClick={()=>setActiveTab('alertas')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab==='alertas'?'tab-active':'tab-inactive hover:bg-gray-200'}`}>⚠️ Alertas</button>
                                    <button onClick={()=>setActiveTab('historial')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab==='historial'?'tab-active':'tab-inactive hover:bg-gray-200'}`}>🕐 Correcciones</button>
                                    <button onClick={()=>setActiveTab('calendario')} className={`px-6 py-2 rounded-lg font-semibold transition-all ${activeTab==='calendario'?'tab-active':'tab-inactive hover:bg-gray-200'}`}>📅 Calendario</button>
                                </div>
                            </div>

                            {activeTab === 'registros' && (
                                <div>
                                    {!isOnline && (
                                        <div className="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-xl flex items-center justify-between">
                                            <div><p className="font-semibold text-yellow-800">Modo Offline</p><p className="text-sm text-yellow-700">Los registros se guardan localmente</p></div>
                                            <button onClick={sincronizarRegistrosOffline} disabled={syncing||!isOnline} className="flex items-center gap-2 px-4 py-2 bg-azul-lgm hover:bg-[#1a1f45] disabled:bg-gray-400 text-white rounded-xl"><CloudUpload className="w-4 h-4" />{syncing?'Sincronizando...':'Sincronizar'}</button>
                                        </div>
                                    )}
                                    <div className="bg-blue-50 p-6 rounded-xl mb-6 border border-blue-200">
                                        <h3 className="text-xl font-bold text-azul-lgm mb-4 flex items-center gap-2"><Calendar className="w-6 h-6" /> Exportar Registros por Fechas</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                            <div><label className="block text-sm font-medium text-gray-700 mb-2">Fecha Inicio *</label><input type="date" value={fechaInicio} onChange={e=>setFechaInicio(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" /></div>
                                            <div><label className="block text-sm font-medium text-gray-700 mb-2">Fecha Fin (opcional)</label><input type="date" value={fechaFin} onChange={e=>setFechaFin(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" /><p className="text-xs text-gray-500 mt-1">Si no selecciona, solo la fecha de inicio</p></div>
                                            <div className="flex items-end"><button onClick={exportarExcelPorFechas} disabled={!fechaInicio} className="w-full flex items-center justify-center gap-2 px-6 py-3 bg-azul-lgm hover:bg-[#1a1f45] disabled:bg-gray-400 text-white rounded-xl transition-all font-semibold shadow-lg"><Download className="w-5 h-5" />Exportar por Fechas</button></div>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 mb-6">
                                        <button onClick={exportarExcel} disabled={registrosHoy.length===0} className="flex items-center gap-2 px-6 py-3 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white rounded-xl transition-all font-semibold shadow-lg"><Download className="w-5 h-5" />Exportar Hoy ({registrosHoy.length} registros)</button>
                                    </div>
                                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                                        <h2 className="text-2xl font-bold text-gray-800 mb-6">Registros de Hoy {firebaseInitialized ? '(Tiempo Real)' : '(Modo Local)'}</h2>
                                        <div className="overflow-x-auto">
                                            <table className="w-full">
                                                <thead className="bg-gray-50"><tr><th className="px-4 py-3 text-left text-sm font-semibold">Local</th><th className="px-4 py-3 text-left text-sm font-semibold">Inquilino</th><th className="px-4 py-3 text-left text-sm font-semibold">Lectura</th><th className="px-4 py-3 text-left text-sm font-semibold">Hora</th><th className="px-4 py-3 text-left text-sm font-semibold">Guardia</th><th className="px-4 py-3 text-left text-sm font-semibold">Foto</th><th className="px-4 py-3 text-left text-sm font-semibold">Estado</th><th className="px-4 py-3 text-left text-sm font-semibold">Acciones</th></tr></thead>
                                                <tbody className="divide-y divide-gray-200">
                                                    {registrosHoy.length===0 ? <tr><td colSpan="8" className="px-4 py-8 text-center text-gray-500">No hay registros para hoy</td></tr> : registrosHoy.map(r => (
                                                        <tr key={r.firebaseId||r.id} className="hover:bg-gray-50">
                                                            <td className="px-4 py-3 text-sm font-medium text-gray-900">{r.local}</td>
                                                            <td className="px-4 py-3 text-sm text-gray-700">{r.inquilino}</td>
                                                            <td className="px-4 py-3 text-sm text-gray-700 font-semibold">{r.lectura} m³{r.lecturaAnterior && <div className="text-xs text-red-600">Corregido: {r.lecturaAnterior} → {r.lectura}</div>}</td>
                                                            <td className="px-4 py-3 text-sm text-gray-700">{new Date(r.fecha).toLocaleTimeString()}{r.fechaCorreccion && <div className="text-xs text-blue-600">Corregido: {new Date(r.fechaCorreccion).toLocaleTimeString()}</div>}</td>
                                                            <td className="px-4 py-3 text-sm text-gray-700">{r.guardia}{r.corregidoPor && r.corregidoPor!==r.guardia && <div className="text-xs text-blue-600">Corregido por: {r.corregidoPor}</div>}</td>
                                                            <td className="px-4 py-3">{r.foto ? <img src={r.foto} alt="medidor" className="w-16 h-16 object-cover rounded-lg cursor-pointer shadow-sm" onClick={()=>window.open(r.foto,'_blank')} /> : <span className="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">Sin foto</span>}</td>
                                                            <td className="px-4 py-3">{r.firebaseId ? <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full"><Wifi className="w-3 h-3" />En Firebase</span> : <span className="inline-flex items-center gap-1 px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full"><WifiOff className="w-3 h-3" />Local</span>}{r.fechaCorreccion && <span className="inline-flex items-center gap-1 px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full mt-1">Corregido</span>}</td>
                                                            <td className="px-4 py-3"><div className="flex gap-2"><button onClick={()=>{ setEditandoRegistro(r); setEditLectura(r.lectura); }} className="flex items-center gap-1 px-3 py-1 bg-azul-lgm hover:bg-[#1a1f45] text-white rounded-lg text-xs"><Edit className="w-3 h-3" />Editar</button><button onClick={()=>eliminarRegistro(r)} className="flex items-center gap-1 px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs"><Trash className="w-3 h-3" />Eliminar</button></div></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                            {activeTab === 'dashboard' && <AdminDashboard registros={registros} locales={locales} />}
                            {activeTab === 'alertas' && <AdminAlertas registros={registros} locales={locales} />}
                            {activeTab === 'historial' && <AdminHistorial registros={registros} />}
                            {activeTab === 'calendario' && (
                                <div>
                                    <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200 mb-6">
                                        <div className="flex justify-end items-center gap-3">
                                            <select value={mesSeleccionado} onChange={e=>setMesSeleccionado(parseInt(e.target.value))} className="px-4 py-2 border border-gray-300 rounded-lg">
                                                {meses.map((m,idx)=> <option key={idx} value={idx}>{m}</option>)}
                                            </select>
                                            <select value={anioSeleccionado} onChange={e=>setAnioSeleccionado(parseInt(e.target.value))} className="px-4 py-2 border border-gray-300 rounded-lg">
                                                {[2023,2024,2025,2026].map(a => <option key={a} value={a}>{a}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <AdminCalendario registros={registros} locales={locales} mesSeleccionado={mesSeleccionado} anioSeleccionado={anioSeleccionado} />
                                </div>
                            )}
                        </div>
                        <EditModal editandoRegistro={editandoRegistro} editLectura={editLectura} setEditLectura={setEditLectura} onGuardar={guardarEdicion} onCancelar={()=>{ setEditandoRegistro(null); setEditLectura(''); }} loading={loading} />
                    </div>
                );
            }

            // ---------- VISTA GUARDIA ----------
            return (
                <div className="min-h-screen bg-gray-50 p-4">
                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-200">
                            <div className="flex justify-between items-center mb-6">
                                <div><h1 className="text-2xl font-bold text-azul-lgm mb-2">Registro de Medidores</h1><p className="text-gray-600">Hola, <span className="font-semibold text-verde-lgm">{user.nombre}</span></p></div>
                                <div className="flex items-center gap-3">
                                    {isOnline ? <span className="flex items-center gap-1 text-green-600 text-sm bg-green-50 px-3 py-1 rounded-full"><Wifi className="w-4 h-4" />{firebaseInitialized?'Firebase':'Local'}</span> : <span className="flex items-center gap-1 text-orange-600 text-sm bg-orange-50 px-3 py-1 rounded-full"><WifiOff className="w-4 h-4" />Offline</span>}
                                    <button onClick={() => { setUser(null); setView('login'); }} className="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl"><LogOut className="w-4 h-4" />Salir</button>
                                </div>
                            </div>
                            {syncStatus && <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-800">{syncStatus}</div>}
                            {firebaseError && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-800">{firebaseError}</div>}
                            <div className="bg-blue-50 p-4 rounded-xl mb-6 border border-gray-200">
                                <p className="text-sm text-gray-700 mb-2">Progreso de hoy: {progreso.completados} / {progreso.total} locales</p>
                                <div className="w-full bg-gray-200 rounded-full h-3"><div className="bg-verde-lgm h-3 rounded-full transition-all duration-500 shadow-lg" style={{width:`${progreso.porcentaje}%`}}></div></div>
                            </div>

                            {/* Corrección anterior */}
                            <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl mb-6">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-lg font-semibold text-yellow-800 flex items-center gap-2"><History className="w-5 h-5" />¿Corregir lectura anterior?</h3>
                                    <button onClick={()=>setMostrarHistorial(!mostrarHistorial)} className="text-sm text-yellow-700 underline">{mostrarHistorial?'Ocultar':'Mostrar'}</button>
                                </div>
                                {mostrarHistorial && (
                                    <div className="space-y-4 mt-3">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div><label className="block text-sm font-medium text-yellow-700 mb-2">Fecha a corregir *</label><input type="date" value={fechaCorreccion} onChange={e=>setFechaCorreccion(e.target.value)} max={obtenerHoy()} className="w-full px-4 py-2 border border-yellow-300 rounded-lg" /></div>
                                            <div><label className="block text-sm font-medium text-yellow-700 mb-2">Local a corregir *</label><select value={localCorreccion} onChange={e=>setLocalCorreccion(e.target.value)} className="w-full px-4 py-2 border border-yellow-300 rounded-lg"><option value="">-- Seleccione --</option>{locales.map(l=><option key={l.numero} value={l.numero}>{l.numero} - {l.inquilino}</option>)}</select></div>
                                        </div>
                                        {fechaCorreccion && localCorreccion && (
                                            <div className="mt-4">
                                                <h4 className="font-semibold mb-2 text-yellow-800">Registros encontrados:</h4>
                                                {buscarRegistrosCorreccion().length===0 ? <p className="text-sm text-yellow-700 bg-yellow-100 p-3 rounded-lg">No se encontraron registros</p> : 
                                                    buscarRegistrosCorreccion().map(reg => (
                                                        <div key={reg.id||reg.firebaseId} className="border border-yellow-300 rounded-lg p-3 mb-2 bg-white flex justify-between items-center">
                                                            <div><p className="font-medium">Lectura: {reg.lectura} m³</p><p className="text-xs text-gray-600">{new Date(reg.fecha).toLocaleTimeString()}</p></div>
                                                            <button onClick={()=>{ setEditandoRegistro(reg); setEditLectura(reg.lectura); setMostrarHistorial(false); }} className="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg text-sm">Corregir</button>
                                                        </div>
                                                    ))
                                                }
                                            </div>
                                        )}
                                    </div>
                                )}
                                <p className="text-sm text-yellow-700 mt-3"><strong>Nota:</strong> Puede corregir lecturas de días anteriores.</p>
                            </div>

                            {error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-start gap-2 mb-4"><AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5" /><span className="text-sm">{error}</span></div>}
                            {success && <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl flex items-start gap-2 mb-4"><CheckCircle className="w-5 h-5 flex-shrink-0 mt-0.5" /><span className="text-sm">{success}</span></div>}

                            <div className="space-y-6">
                                <SelectLocal locales={locales} registros={registros} selectedLocal={selectedLocal} onChange={setSelectedLocal} searchTerm={searchTerm} onSearchChange={setSearchTerm} />
                                {selectedLocal && (
                                    <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl">
                                        <p className="text-sm text-yellow-800"><strong>Local {selectedLocal} - {locales.find(l=>String(l.numero)===String(selectedLocal))?.inquilino}</strong><br/>Última lectura: {locales.find(l=>String(l.numero)===String(selectedLocal))?.ultimaLectura||0} m³</p>
                                    </div>
                                )}
                                <div><label className="block text-sm font-medium text-gray-700 mb-2">Lectura del Medidor (m³) *</label><input type="number" step="0.01" value={lectura} onChange={e=>setLectura(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-verde-lgm" placeholder="Ej: 1234.56" /></div>
                                <ImageUploader foto={foto} onFileChange={handleFileChange} loading={loading} />
                                <button onClick={handleSubmit} disabled={loading} className="w-full flex items-center justify-center gap-2 bg-verde-lgm hover:bg-[#7a8560] disabled:bg-gray-400 text-white font-semibold py-3 rounded-xl transition-all transform hover:scale-105 shadow-lg"><Camera className="w-5 h-5" />{loading ? 'Guardando...' : 'Registrar Lectura'}</button>
                            </div>
                        </div>

                        {/* Mis registros */}
                        <div className="bg-white rounded-2xl shadow-xl p-6 border border-gray-200">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold text-gray-800">Mis Registros</h2>
                                <div className="flex items-center gap-2"><label className="text-sm text-gray-700">Ver fecha:</label><input type="date" value={fechaFiltroGuardia} onChange={e=>setFechaFiltroGuardia(e.target.value)} className="px-3 py-1 border border-gray-300 rounded-lg" /></div>
                            </div>
                            <div className="space-y-3">
                                {registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha)===fechaFiltroGuardia && r.username===user.username).sort(ordenarRegistros).map(r => (
                                    <div key={r.firebaseId||r.id} className="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                                        <div className="flex-1">
                                            <p className="font-medium text-gray-800">{r.local} - {r.inquilino}</p>
                                            <p className="text-sm text-gray-600">{r.lectura} m³ - {new Date(r.fecha).toLocaleTimeString()}</p>
                                            <p className="text-xs text-gray-500 mt-1">{r.firebaseId ? <span className="text-green-600">✓ Sincronizado</span> : <span className="text-yellow-600">● Local</span>}{r.fechaCorreccion && <span className="text-blue-600 ml-2">● Corregido</span>}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={()=>{ setEditandoRegistro(r); setEditLectura(r.lectura); }} className="flex items-center gap-1 px-3 py-1 bg-azul-lgm hover:bg-[#1a1f45] text-white rounded-lg text-xs"><Edit className="w-3 h-3" />Editar</button>
                                            <button onClick={()=>eliminarRegistro(r)} className="flex items-center gap-1 px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs"><Trash className="w-3 h-3" />Eliminar</button>
                                        </div>
                                    </div>
                                ))}
                                {registros.filter(r => r.fecha && obtenerFechaLocal(r.fecha)===fechaFiltroGuardia && r.username===user.username).length===0 && <p className="text-center text-gray-500 py-4">No hay registros para esta fecha</p>}
                            </div>
                        </div>

                        <EditModal editandoRegistro={editandoRegistro} editLectura={editLectura} setEditLectura={setEditLectura} onGuardar={guardarEdicion} onCancelar={()=>{ setEditandoRegistro(null); setEditLectura(''); }} loading={loading} />
                    </div>
                </div>
            );
        };

        ReactDOM.render(<MedidorApp />, document.getElementById('root'));
    </script>
</body>
</html>
